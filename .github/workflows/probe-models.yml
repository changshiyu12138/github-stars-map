name: 探针-模型访问通路
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 测各种 integration id（GITHUB_TOKEN 能否零配置用 Copilot）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ['GITHUB_TOKEN']
          data = json.dumps({'model':'gpt-4.1','messages':[{'role':'user','content':'hi'}],'max_tokens':5}).encode()
          for iid in [None,'github-copilot','copilot','github-actions','copilot-cli','github-copilot-cli','vscode-chat']:
              h={'Authorization':f'Bearer {tok}','Content-Type':'application/json'}
              if iid: h['Copilot-Integration-Id']=iid
              req=urllib.request.Request('https://api.githubcopilot.com/chat/completions',data=data,headers=h)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      print(f'  iid={str(iid):22s} -> HTTP {r.status} 真实响应')
              except urllib.error.HTTPError as e:
                  b=e.read().decode()[:110].replace('\n',' ')
                  print(f'  iid={str(iid):22s} -> HTTP {e.code}  {b}')
              except Exception as e:
                  print(f'  iid={str(iid):22s} -> {type(e).__name__}')
          PY
