name: Sync Star 地图

# 每 6 小时执行一次；也支持手动触发
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # 允许使用 GitHub Models（免费额度），用内置 GITHUB_TOKEN 即可，无需任何 API key
  models: read

concurrency:
  group: star-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Git 身份
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: 拉取 Star 列表
        run: |
          python <<'PY'
          import json, time, urllib.request

          # Star 列表是公开数据，走 /users/{user}/starred 无需任何认证，
          # 因此本工作流不需要配置任何 PAT secret。
          USER = 'changshiyu12138'
          headers = {
              'Accept': 'application/vnd.github.star+json',
              'User-Agent': 'github-actions-star-sync',
          }
          items, page = [], 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/users/{USER}/starred?per_page=100&page={page}',
                  headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  batch = json.load(r)
              if not batch:
                  break
              items.extend(batch)
              page += 1
              if len(batch) < 100:
                  break
              time.sleep(1)

          with open('stars_raw.json', 'w', encoding='utf-8') as f:
              json.dump(items, f, ensure_ascii=False)
          print(f'拉取到 {len(items)} 个 Star')
          PY

      - name: 构建 stars.json 并检测新增
        run: |
          # build_stars.py 在有新项目时退出码为 2，属于正常情况；
          # 其他非零退出码说明脚本真的坏了，需要暴露出来。
          set +e
          python build_stars.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::build_stars.py 异常退出 (code=$code)"
            exit "$code"
          fi
          if [ "$code" -eq 2 ]; then
            echo "存在新项目，继续执行分类"
          fi

      - name: LLM 自动分类
        id: llm
        continue-on-error: true
        env:
          # GitHub Copilot —— 优先。用 Copilot Free 自带的额度，不花钱。
          # 必须是「用户 OAuth 令牌」，Actions 的 GITHUB_TOKEN 是 App 安装令牌，
          # Copilot API 会拒绝（integration id 不匹配）。
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          # GitHub Models —— 官方零配置方案（内置令牌 + models: read）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 备选：自备 key 的国内模型服务（按量计费）
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          # 任何失败都不能让流水线断掉：脚本内部已做规则引擎兜底，
          # 这里再兜一层，LLM 不可用时流程照常完成。
          python llm_classify.py || echo "::warning::LLM 分类失败，已回退到规则引擎"

      - name: 生成 README
        run: python gen_readme.py

      - name: 提交变更
        id: commit
        run: |
          git add README.md stars.json stars_pending.json map_auto.py 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化，跳过提交"
            exit 0
          fi
          CNT=$(python -c "import json;print(len(json.load(open('stars.json',encoding='utf-8'))))")
          git commit -m "chore: 自动同步 Star 地图（${CNT} 个项目）"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: 写入运行摘要
        if: always()
        run: |
          python <<'PY'
          import json, os

          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return default

          total = len(load('stars.json', []))
          pending = load('stars_pending.json', [])
          changed = os.environ.get('CHANGED', 'false')
          # map_auto.py 是 Python 源码，安全读取其中的 AUTO_NOTES
          try:
              import importlib.util
              spec = importlib.util.spec_from_file_location('map_auto', 'map_auto.py')
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              auto = list(getattr(mod, 'AUTO_NOTES', {}).items())
          except Exception:
              auto = []

          lines = ['## ⭐ Star 地图同步', '']
          lines.append(f'- 当前收藏总数：**{total}** 个')
          lines.append(f'- 🤖 自动归类：**{len(auto)}** 个')
          lines.append(f'- ⏳ 待人工确认：**{len(pending)}** 个')
          lines.append(f"- 是否提交：{'是' if changed == 'true' else '否'}")

          if auto:
              lines += ['', '### 🤖 自动归类的项目', '']
              for full, (cat, desc) in auto:
                  lines.append(f"- `{full}` → **{cat}** — {desc}")

          if pending:
              lines += ['', '### ⏳ 待人工确认的项目', '']
              for p in pending:
                  # 简介来自 GitHub，可能含引号/反引号/换行，统一压平
                  desc = (p.get('desc') or '（官方无简介）').replace('\n', ' ')[:70]
                  lines.append(f"- `{p['full']}` — {desc}")
              lines += ['', '> 补写说明：编辑 `map.py` 加入 `"owner/repo": ("分类", "说明"),` 后重跑即可。']

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')

          print(f'自动归类 {len(auto)} 个，待确认 {len(pending)} 个')
          PY
