name: Sync Star 地图

# 每 6 小时执行一次；也支持手动触发
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Git 身份
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: 拉取 Star 列表
        run: |
          python <<'PY'
          import json, time, urllib.request

          # Star 列表是公开数据，走 /users/{user}/starred 无需任何认证，
          # 因此本工作流不需要配置任何 PAT secret。
          USER = 'changshiyu12138'
          headers = {
              'Accept': 'application/vnd.github.star+json',
              'User-Agent': 'github-actions-star-sync',
          }
          items, page = [], 1
          while True:
              req = urllib.request.Request(
                  f'https://api.github.com/users/{USER}/starred?per_page=100&page={page}',
                  headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  batch = json.load(r)
              if not batch:
                  break
              items.extend(batch)
              page += 1
              if len(batch) < 100:
                  break
              time.sleep(1)

          with open('stars_raw.json', 'w', encoding='utf-8') as f:
              json.dump(items, f, ensure_ascii=False)
          print(f'拉取到 {len(items)} 个 Star')
          PY

      - name: 构建 stars.json 并检测新增
        run: |
          # build_stars.py 在存在待归类项目时退出码为 2，属于正常情况；
          # 其他非零退出码说明脚本真的坏了，需要暴露出来。
          set +e
          python build_stars.py
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::build_stars.py 异常退出 (code=$code)"
            exit "$code"
          fi
          if [ "$code" -eq 2 ]; then
            echo "存在待归类项目，继续执行"
          fi

      - name: 生成 README
        run: python gen_readme.py

      - name: 提交变更
        id: commit
        run: |
          git add README.md stars.json stars_pending.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "无变化，跳过提交"
            exit 0
          fi
          CNT=$(python -c "import json;print(len(json.load(open('stars.json',encoding='utf-8'))))")
          git commit -m "chore: 自动同步 Star 地图（${CNT} 个项目）"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - name: 写入运行摘要
        if: always()
        run: |
          python <<'PY'
          import json, os

          def load(path, default):
              try:
                  with open(path, encoding='utf-8') as f:
                      return json.load(f)
              except Exception:
                  return default

          total = len(load('stars.json', []))
          pending = load('stars_pending.json', [])
          changed = os.environ.get('CHANGED', 'false')

          lines = ['## ⭐ Star 地图同步', '']
          lines.append(f'- 当前收藏总数：**{total}** 个')
          lines.append(f'- 待归类：**{len(pending)}** 个')
          lines.append(f"- 是否提交：{'是' if changed == 'true' else '否'}")

          if pending:
              lines += ['', '### 🆕 新发现的项目', '']
              for p in pending:
                  # 简介来自 GitHub，可能含引号/反引号/换行，统一压平
                  desc = (p.get('desc') or '（官方无简介）').replace('\n', ' ')[:70]
                  lines.append(f"- `{p['full']}` — {desc}")
              lines += ['', '> 补写说明：编辑 `map.py` 加入 `"owner/repo": ("分类", "说明"),` 后重跑即可。']

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')

          print(f'待归类数量: {len(pending)}')
          PY
