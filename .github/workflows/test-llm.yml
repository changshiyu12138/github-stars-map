name: 测试 LLM 分类通路

# 临时测试工作流：验证 GitHub Models 调用、JSON 解析、校验、缓存、降级
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备测试数据
        run: |
          cat > stars_pending.json <<'EOF'
          [
           {"full": "K-Dense-AI/claude-scientific-skills", "url": "u", "lang": "Python",
            "stars": 9000, "topics": ["claude", "skills", "science", "research"], "at": "2026-10-31",
            "desc": "A collection of Claude Code scientific skills"},
           {"full": "danielmiessler/fabric", "url": "u", "lang": "Python", "stars": 25000,
            "topics": ["ai", "patterns", "llm", "cli", "fabric"], "at": "2026-10-31",
            "desc": "An open-source framework for applying AI to practical tasks"},
           {"full": "eyaltoledano/claude-task-master", "url": "u", "lang": "Python", "stars": 12000,
            "topics": ["ai", "claude", "task-management", "mcp", "agents"], "at": "2026-10-31",
            "desc": "An AI-powered task management system for Claude"},
           {"full": "some-org/totally-ambiguous-thing", "url": "u", "lang": "Rust", "stars": 5,
            "topics": ["weird", "xyz"], "at": "2026-10-31",
            "desc": "Something with no clear category signal at all"}
          ]
          EOF

      - name: 直接探测 GitHub Models API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import os, json, urllib.request, urllib.error

          tok = os.environ['GITHUB_TOKEN']
          endpoints = [
              'https://models.github.ai/inference/chat/completions',
              'https://models.inference.ai.azure.com/chat/completions',
          ]
          models = ['openai/gpt-4o-mini', 'microsoft/Phi-4-mini-instruct']
          for ep in endpoints:
              for model in models:
                  try:
                      req = urllib.request.Request(
                          ep,
                          data=json.dumps({
                              'model': model,
                              'messages': [{'role':'user','content':'hi'}],
                              'max_tokens': 20}).encode(),
                          headers={'Authorization': f'Bearer {tok}',
                                   'Content-Type':'application/json',
                                   'Accept':'application/json'})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          raw = r.read().decode()
                          print(f'--- {ep} | {model} | HTTP {r.status}')
                          print('RAW:', raw[:400])
                          break
                  except urllib.error.HTTPError as e:
                      body = e.read().decode()[:300]
                      print(f'--- {ep} | {model} | HTTP {e.code}')
                      print('BODY:', body)
                  except Exception as e:
                      print(f'--- {ep} | {model} | {type(e).__name__}: {e}')
          PY

      - name: 运行 LLM 分类
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
        run: python llm_classify.py

      - name: 输出结果
        run: |
          echo "=== map_auto.py ==="
          cat map_auto.py
          echo "=== 剩余 pending ==="
          cat stars_pending.json
