name: 测试 LLM 分类通路

# 临时测试工作流：验证 GitHub Models 调用、JSON 解析、校验、缓存、降级
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备测试数据
        run: |
          cat > stars_pending.json <<'EOF'
          [
           {"full": "K-Dense-AI/claude-scientific-skills", "url": "u", "lang": "Python",
            "stars": 9000, "topics": ["claude", "skills", "science", "research"], "at": "2026-10-31",
            "desc": "A collection of Claude Code scientific skills"},
           {"full": "danielmiessler/fabric", "url": "u", "lang": "Python", "stars": 25000,
            "topics": ["ai", "patterns", "llm", "cli", "fabric"], "at": "2026-10-31",
            "desc": "An open-source framework for applying AI to practical tasks"},
           {"full": "eyaltoledano/claude-task-master", "url": "u", "lang": "Python", "stars": 12000,
            "topics": ["ai", "claude", "task-management", "mcp", "agents"], "at": "2026-10-31",
            "desc": "An AI-powered task management system for Claude"},
           {"full": "some-org/totally-ambiguous-thing", "url": "u", "lang": "Rust", "stars": 5,
            "topics": ["weird", "xyz"], "at": "2026-10-31",
            "desc": "Something with no clear category signal at all"}
          ]
          EOF

      - name: 直接探测 GitHub Models API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import os, json, urllib.request, urllib.error

          tok = os.environ['GITHUB_TOKEN']
          print('TOKEN 前缀:', tok[:4], '长度', len(tok))

          # 1) catalog 端点（GET，无需 chat）
          for ep in ['https://models.github.ai/catalog/models',
                     'https://models.github.ai/inference/models',
                     'https://api.github.com/models']:
              try:
                  req = urllib.request.Request(ep, headers={
                      'Authorization': f'Bearer {tok}',
                      'Accept':'application/json',
                      'X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      print(f'[CATALOG] {ep} -> HTTP {r.status} ct={r.headers.get("Content-Type")}')
                      print('   ', raw[:200])
              except urllib.error.HTTPError as e:
                  print(f'[CATALOG] {ep} -> HTTP {e.code}:', e.read().decode()[:150])
              except Exception as e:
                  print(f'[CATALOG] {ep} -> {type(e).__name__}: {e}')

          # 2) chat 端点，带各种 header 组合
          hdr_sets = [
              ('bare', {'Authorization': f'Bearer {tok}', 'Content-Type':'application/json'}),
              ('api-version', {'Authorization': f'Bearer {tok}', 'Content-Type':'application/json',
                               'X-GitHub-Api-Version':'2022-11-28'}),
              ('token-prefix', {'Authorization': f'token {tok}', 'Content-Type':'application/json'}),
              ('no-auth', {'Content-Type':'application/json'}),
          ]
          for name, hdr in hdr_sets:
              try:
                  req = urllib.request.Request(
                      'https://models.github.ai/inference/chat/completions',
                      data=json.dumps({'model':'openai/gpt-4o-mini',
                                       'messages':[{'role':'user','content':'hi'}],
                                       'max_tokens':20}).encode(),
                      headers=hdr)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      print(f'[CHAT:{name}] HTTP {r.status} ct={r.headers.get("Content-Type")}')
                      print('   ', raw[:250])
              except urllib.error.HTTPError as e:
                  print(f'[CHAT:{name}] HTTP {e.code}:', e.read().decode()[:200])
              except Exception as e:
                  print(f'[CHAT:{name}] {type(e).__name__}: {e}')
          PY

      - name: 运行 LLM 分类
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
        run: python llm_classify.py

      - name: 输出结果
        run: |
          echo "=== map_auto.py ==="
          cat map_auto.py
          echo "=== 剩余 pending ==="
          cat stars_pending.json
