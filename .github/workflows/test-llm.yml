name: 测试 LLM 分类通路

# 临时测试工作流：验证 GitHub Models 调用、JSON 解析、校验、缓存、降级
on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 测试 actions/ai-inference action
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4o-mini
          prompt: |
            只输出 JSON，不要解释。格式：{"ok": true}
            内容：{"ok": true}

      - name: 打印 action 结果
        if: always()
        run: |
          echo "response 长度: ${#{{ steps.ai.outputs.response }}}"
          echo "response: ${{ steps.ai.outputs.response }}"
          echo "exitcode: ${{ steps.ai.outputs.exitcode }}"

      - name: 测试 gh models CLI
        continue-on-error: true
        run: |
          gh models --help 2>&1 | head -20 || echo "gh models 不可用"
          echo "---"
          gh models run --help 2>&1 | head -20 || echo "gh models run 不可用"

      - name: 测试 gh models run 实际调用
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh models run openai/gpt-4o-mini --prompt "只回复两个字：可用" 2>&1 | head -20 || echo "调用失败"

      - name: 准备测试数据
        run: |
          cat > stars_pending.json <<'EOF'
          [
           {"full": "K-Dense-AI/claude-scientific-skills", "url": "u", "lang": "Python",
            "stars": 9000, "topics": ["claude", "skills", "science", "research"], "at": "2026-10-31",
            "desc": "A collection of Claude Code scientific skills"},
           {"full": "danielmiessler/fabric", "url": "u", "lang": "Python", "stars": 25000,
            "topics": ["ai", "patterns", "llm", "cli", "fabric"], "at": "2026-10-31",
            "desc": "An open-source framework for applying AI to practical tasks"},
           {"full": "some-org/totally-ambiguous-thing", "url": "u", "lang": "Rust", "stars": 5,
            "topics": ["weird", "xyz"], "at": "2026-10-31",
            "desc": "Something with no clear category signal at all"}
          ]
          EOF

      - name: 运行 LLM 分类
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: openai/gpt-4o-mini
        run: python llm_classify.py

      - name: 输出结果
        if: always()
        run: |
          echo "=== map_auto.py ==="
          cat map_auto.py 2>/dev/null || echo "(无)"
          echo "=== 剩余 pending ==="
          cat stars_pending.json
